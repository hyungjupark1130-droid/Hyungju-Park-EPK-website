short_bio: "Musician, producer, and sound engineer based in London. Currently studying at the Guildhall School of Music."
long_bio: "Hyungju Park is a musician, producer, and engineer from Korea, currently studying at the Guildhall School of Music under Professor Junho Lee.\n\nHe is largely self-taught and began producing music in middle school. His early work covered a range of electronic genres, including complextro, future house, future bass, drum and bass, IDM, doujin music, and hitech. From 2022 to 2024 he trained in jazz. He plays keyboard and electric bass, and also plays electric guitar.\n\nHis main influence is Sheena Ringo, the Japanese musician and former leader of Tokyo Jihen, whose work spans punk rock, film scoring, big band and chamber jazz, and electronic music. Hyungju's own writing has expanded from electronic music into jazz, classical, film, and pop.\n\nHe also works as a recording engineer, mainly on sessions with pianists and string players."
